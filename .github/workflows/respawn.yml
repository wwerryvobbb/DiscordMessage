name: Respawn on Cancelled

on:
  workflow_run:
    workflows: ["Discord Loop Bot"]
    types:
      - completed

jobs:
  respawn:
    if: ${{ github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - name: Trigger Instant Restart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Main workflow was cancelled. Instant respawn triggered..."
          gh workflow run bot.yml --repo ${{ github.repository }} --ref ${{ github.event.workflow_run.head_branch }} || true
